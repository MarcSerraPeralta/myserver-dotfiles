<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<title>Random plans</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #eaf3ff, #ffffff);
  padding: 20px;
  margin: 0;
}

.header-container {
  text-align: center;
  margin-bottom: 25px;
}

h1 {
  color: #1e3a8a;
  margin-bottom: 15px;
}

.random-btn {
  background-color: #2563eb;
  color: white;
  border: none;
  padding: 12px 24px;
  font-size: 16px;
  font-weight: bold;
  border-radius: 25px;
  cursor: pointer;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  transition: background-color 0.2s, transform 0.1s;
}

.random-btn:hover {
  background-color: #1d4ed8;
  transform: translateY(-2px);
}

.random-btn:active {
  transform: translateY(0);
}

#plans {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
  max-width: 900px;
  margin: 0 auto;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.1);
  cursor: pointer;
  user-select: none;
  position: relative;
  transition: 0.2s;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;

  min-height: 110px;
}

.card:hover {
  transform: translateY(-4px);
}

.card.done {
  background: #d1fae5;
}

.icon {
  font-size: 32px;
  margin-bottom: 6px;
}

.text {
  font-weight: bold;
  font-size: 14px;
  color: #111;
}

.tick {
  position: absolute;
  bottom: 8px;
  right: 10px;
  font-size: 18px;
  color: green;
  display: none;
}

.card.done .tick {
  display: block;
}

.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  z-index: 1000;
}

.modal-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.modal-card {
  background: white;
  padding: 30px;
  border-radius: 20px;
  text-align: center;
  max-width: 320px;
  width: 80%;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  transform: scale(0.8);
  transition: transform 0.3s ease;
}

.modal-overlay.active .modal-card {
  transform: scale(1);
}

.modal-card h2 {
  margin-top: 0;
  color: #1e3a8a;
  font-size: 18px;
}

.modal-card .random-icon {
  font-size: 48px;
  margin: 15px 0;
}

.modal-card .random-text {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 20px;
}

.close-btn {
  background: #1e3a8a;
  color: white;
  border: none;
  padding: 8px 20px;
  border-radius: 12px;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="header-container">
  <h1>Random plans</h1>
  <button id="random-btn" class="random-btn">🎲 Random</button>
</div>

<div id="plans"></div>

<div id="random-modal" class="modal-overlay">
  <div class="modal-card">
    <h2>Pla Seleccionat!</h2>
    <div id="random-icon" class="random-icon"></div>
    <div id="random-text" class="random-text"></div>
    <button id="close-modal" class="close-btn">Tancar</button>
  </div>
</div>

<script>
let plansData = [];
const container = document.getElementById("plans");
const randomBtn = document.getElementById("random-btn");
const randomModal = document.getElementById("random-modal");
const closeModal = document.getElementById("close-modal");
const randomIcon = document.getElementById("random-icon");
const randomText = document.getElementById("random-text");

// --- API FUNCTIONS ---
async function loadPlans() {
    try {
        const response = await fetch('/api/plans');
        return await response.json();
    } catch (e) {
        console.error("Error loading plans:", e);
        return [];
    }
}

async function savePlans(updatedPlans) {
    try {
        await fetch('/api/plans', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(updatedPlans)
        });
    } catch (e) {
        console.error("Error saving plans:", e);
    }
}

async function fetchRandomPlan() {
    try {
        const response = await fetch('/api/random');
        return await response.json();
    } catch (e) {
        console.error("Error fetching random plan:", e);
        return null;
    }
}

// --- RENDER LOGIC ---
function render() {
    container.innerHTML = "";

    plansData.forEach((plan, i) => {
        const card = document.createElement("div");
        card.className = "card";
        if (plan.done) card.classList.add("done");

        card.innerHTML = `
            <div class="icon">${plan.icon}</div>
            <div class="text">${plan.text}</div>
            <div class="tick">✔</div>
        `;

        // Toggle state click handler
        card.addEventListener("click", async () => {
            plansData[i].done = !plansData[i].done;
            await savePlans(plansData);
            render();
        });

        container.appendChild(card);
    });
}

// --- RANDOM BUTTON HANDLER ---
randomBtn.addEventListener("click", async () => {
    const plan = await fetchRandomPlan();
    if (plan) {
        randomIcon.textContent = plan.icon;
        randomText.textContent = plan.text;
        randomModal.classList.add("active");
    }
});

closeModal.addEventListener("click", () => {
    randomModal.classList.remove("active");
});

randomModal.addEventListener("click", (e) => {
    if (e.target === randomModal) {
        randomModal.classList.remove("active");
    }
});

// Initial Load
(async () => {
    plansData = await loadPlans();
    render();
})();
</script>

</body>
</html>
