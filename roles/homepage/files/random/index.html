<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Random plans</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<style>
    body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
	padding: 10px 0;
    }

    h1 {
        margin-bottom: 2rem;
        font-weight: 600;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, 180px);
        gap: 0.6rem;
        width: 95%;
	justify-content: center;
    }

    .card {
        aspect-ratio: 0.9 / 1;
        background: #1e293b;
        border-radius: 8px;
        text-decoration: none;
        color: inherit;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        border: 1px solid #334155;
        transition: 0.2s ease;
        padding: 1rem;
    }

    .card:hover {
        background: #334155;
        transform: translateY(-4px);
    }

    .icon {
        width: 100px;
        height: 100px;
        object-fit: contain;
    }

    .title {
        font-size: 1rem;
        font-weight: 500;
        text-align: center;
    }
</style>
</head>

<body>

<h1>Random plans</h1>

<h2>Selecciona aleatòriament</h2>

<h2>Llistat de plans</h2>

</body>
</html>
