<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fireworks • Play Fireworks Online!</title>
    <link rel="stylesheet" href="https://unpkg.com/tachyons@4/css/tachyons.min.css">
    <style>
        body { background-color: #00153f; color: white; font-family: sans-serif; margin: 0; }
        .bg-main-dark { background-color: #00153f; }
        .screen { display: none; }
        .screen.active { display: block; }
        
        /* Scaled up standard card styling for hand and fireworks */
        .card-box { width: 5.8rem; height: 5.8rem; border-radius: 0.35rem; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; font-weight: bold; user-select: none; }
        
        /* Card column container to align cards and buttons in columns */
        .card-column { width: 5.8rem; display: flex; flex-direction: column; align-items: center; margin-right: 0.75rem; margin-bottom: 0.5rem; }

        /* Smaller card styling for the discard pile */
        .card-box-small { width: 1.5rem; height: 2.1rem; border-radius: 0.2rem; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; font-weight: bold; user-select: none; font-size: 0.75rem; }

        .card-red { background-color: #e74c3c; color: #fff; border: 1px solid #c0392b; }
        .card-blue { background-color: #3498db; color: #fff; border: 1px solid #2980b9; }
        .card-green { background-color: #27ae60; color: #fff; border: 1px solid #1e8449; }
        .card-yellow { background-color: #f1c40f; color: #2c3e50; border: 1px solid #d4ac0d; }
        .card-white { background-color: #ecf0f1; color: #2c3e50; border: 1px solid #bdc3c7; }
        .card-gray { background-color: #7f8c8d; color: #fff; border: 1px solid #626567; }
        
        /* Hint Matrix for Self Cards */
        .hint-matrix { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; width: 100%; font-size: 0.65rem; position: absolute; bottom: 4px; padding: 0 4px; }
        .hint-item { text-align: center; border-radius: 2px; padding: 1px 0; }
        .crossed { text-decoration: line-through; opacity: 0.15; }
        
        .action-btn { cursor: pointer; transition: transform 0.1s ease; }
        .action-btn:hover { transform: scale(1.05); }

        /* Taller and styled logs container */
        #logs {
            height: 280px;
            max-height: 280px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* Mini-card and hint badges inside action logs */
        .log-card-badge {
            display: inline-block;
            padding: 1px 6px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 11px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin: 0 2px;
        }
        .badge-Red { background-color: #e74c3c; color: white; }
        .badge-Blue { background-color: #3498db; color: white; }
        .badge-Green { background-color: #27ae60; color: white; }
        .badge-Yellow { background-color: #f1c40f; color: #2c3e50; }
        .badge-White { background-color: #ecf0f1; color: #2c3e50; }
        .badge-gray { background-color: #7f8c8d; color: white; }

        /* Small square block for color hints */
        .log-color-square {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 2px;
            vertical-align: middle;
            margin: 0 2px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="bg-main-dark h-100 flex flex-column">

    <div id="login" class="screen active pa4 flex flex-column items-center justify-center vh-100">
        <h1 class="f2 mb3">Fireworks Online</h1>
        <p class="f5 mb4 o-70">Cooperative multiplayer card game</p>
        <div class="bg-black-50 pa4 br3 shadow-2 flex flex-column">
            <input id="p-id" class="input-reset ba b--black-20 pa2 mb3 db w-100 br2 bg-near-white dark-gray" placeholder="Enter Player Name (e.g., Alice, Bob)">
            <button onclick="connect()" class="button-reset b ph3 pv2 input-reset ba b--transparent bg-blue white pointer br2 f5">Connect</button>
        </div>
    </div>

    <div id="lobby" class="screen pa4 flex flex-column items-center justify-center vh-100">
        <div class="bg-black-50 pa4 br3 shadow-2 tc">
            <h2 class="f3 mb3">Game Lobby</h2>
            <p class="mb4 o-70">Waiting for players to join...</p>
            <button onclick="action('start_game')" class="button-reset b ph4 pv3 bg-green white pointer br2 f4 shadow-1">Start Game</button>
        </div>
    </div>

    <div id="game-area" class="screen flex flex-column h-100 w-100">
        <div class="bg-black-50 pa2 ph4 flex justify-between items-center bb b--black-20">
            <div class="w-third"><span id="score" class="f6 f5-l ttu fwb">Score: 0 / 25</span></div>
            <div class="w-third tc">
                <button onclick="action('undo')" class="button-reset bg-black-70 white ba b--black-40 ph3 pv1 pointer f6 br2 shadow-1 action-btn mr2">Undo</button>
                <button onclick="action('quit_game')" class="button-reset bg-red white ba b--red ph3 pv1 pointer f6 br2 shadow-1 action-btn">Quit Game</button>
            </div>
            <div class="w-third tr"><span id="stats" class="f6 f5-l o-90">Lives: 3 | Hints: 8</span></div>
        </div>

        <div class="pa3 flex flex-row justify-between items-start bg-black-20">
            <div>
                <span class="f7 o-60 db mb1">Fireworks</span>
                <div id="fireworks" class="flex flex-row"></div>
            </div>

            <div class="flex items-center">
                <div class="tc flex flex-column items-center">
                    <div id="deck-box" class="card-box card-blue shadow-1 mb1">
                        <span id="deck-count" class="f3 fwbold">0</span>
                    </div>
                    <span class="f7 o-60">deck</span>
                </div>
            </div>

            <div class="flex flex-column items-end">
                <span class="f7 o-60 db mb1">Discard Pile</span>
                <div id="discard-pile" class="flex flex-column items-end"></div>
            </div>
        </div>

        <div id="players-area" class="flex-grow-1 overflow-y-scroll pa3"></div>

        <div id="logs" class="pa2 bg-black-40 o-90"></div>
    </div>

    <script>
        let socket, myId;
        const colorNames = ['Red', 'Blue', 'Green', 'Yellow', 'White'];
        const discardColors = ['Red', 'Yellow', 'Green', 'Blue', 'White'];

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function connect() {
            const nameVal = document.getElementById('p-id').value.trim();
            if (!nameVal) return alert("Please enter a Player Name");
            myId = nameVal;

            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            // Fall back to localhost:8082 if opened via file:// protocol
            const host = window.location.host ? window.location.host : 'localhost:8082';
            
            socket = new WebSocket(`${wsProtocol}//${host}/ws/${encodeURIComponent(myId)}`);

            socket.onmessage = (e) => {
                try {
                    const data = JSON.parse(e.data);
                    
                    if (data.type === "MODE_UPDATE") {
                        showScreen(data.status === 'lobby' ? 'lobby' : 'game-area');
                    } else if (data.type === "STATE_UPDATE") {
                        render(data.state);
                    }
                } catch (err) {
                    console.error("Error parsing message:", err);
                }
            };
        }

        function action(type, extra = {}) {
            socket.send(JSON.stringify({action: type, ...extra}));
        }

        function getCardDisplayColor(card, isMe) {
            if (isMe) {
                const possibleColors = colorNames.filter(c => !(card.eliminated_colors || []).includes(c));
                return possibleColors.length === 1 ? possibleColors[0] : 'gray';
            } else {
                return card.color || 'gray';
            }
        }

        function createHintMatrix(card, isMe) {
            const container = document.createElement('div');
            container.className = 'hint-matrix';
            const colors = card.eliminated_colors || [];
            const ranks = card.eliminated_ranks || [];

            const displayColor = getCardDisplayColor(card, isMe);
            const isLightCard = (displayColor === 'Yellow' || displayColor === 'White');
            const rankTextColor = isLightCard ? '#2c3e50' : '#ffffff';
            const rankBgColor = isLightCard ? 'rgba(0,0,0,0.15)' : 'rgba(255,255,255,0.2)';

            colorNames.forEach(c => {
                const div = document.createElement('div');
                const isCrossed = colors.includes(c);
                div.className = `hint-item ${isCrossed ? 'crossed' : ''}`;
                
                if (c === 'Red') div.style.cssText = "background-color: #e74c3c; color: white; font-weight: bold;";
                else if (c === 'Blue') div.style.cssText = "background-color: #3498db; color: white; font-weight: bold;";
                else if (c === 'Green') div.style.cssText = "background-color: #27ae60; color: white; font-weight: bold;";
                else if (c === 'Yellow') div.style.cssText = "background-color: #f1c40f; color: #2c3e50; font-weight: bold;";
                else if (c === 'White') div.style.cssText = "background-color: #ecf0f1; color: #2c3e50; font-weight: bold;";

                div.innerText = c[0];
                container.appendChild(div);
            });
            [1, 2, 3, 4, 5].forEach(r => {
                const div = document.createElement('div');
                div.className = `hint-item ${ranks.includes(r) ? 'crossed' : ''}`;
                div.style.cssText = `background: ${rankBgColor}; color: ${rankTextColor}; font-weight: bold;`;
                div.innerText = r;
                container.appendChild(div);
            });
            return container;
        }

        function render(state) {
            document.getElementById('stats').innerText = `Lives: ${state.lives} | Hints: ${state.hints}`;
            document.getElementById('score').innerText = `Score: ${state.score} / ${state.max_score}`;
            
            if (state.deck) {
                document.getElementById('deck-count').innerText = state.deck.value;
                const deckColor = (state.deck.color || 'blue').toLowerCase();
                document.getElementById('deck-box').className = `card-box card-${deckColor} shadow-1 mb1`;
            }

            // Render Fireworks with larger font
            const fw = document.getElementById('fireworks');
            fw.innerHTML = (state.fireworks || []).map(f => 
                `<div class="card-box card-${f[0].toLowerCase()} mr2 shadow-1"><span class="f3">${f[1]}</span></div>`
            ).join('');

            // Render Discard Pile
            const dp = document.getElementById('discard-pile');
            dp.innerHTML = (state.discard_pile || []).map((cards, idx) => {
                const color = discardColors[idx] || 'Gray';
                const sortedCards = [...cards].sort((a, b) => a - b);
                
                let rowHTML = `<div class="flex flex-row mb1 items-center">`;
                if (sortedCards.length === 0) {
                    rowHTML += `<span class="f7 o-30 mr1">—</span>`;
                } else {
                    sortedCards.forEach(rank => {
                        rowHTML += `<div class="card-box-small card-${color.toLowerCase()} ml1 shadow-1"><span class="f7">${rank}</span></div>`;
                    });
                }
                rowHTML += `</div>`;
                return rowHTML;
            }).join('');

            // Render Structured Action Logs
            const logsContainer = document.getElementById('logs');
            logsContainer.innerHTML = '';
            if (state.last_actions) {
                state.last_actions.forEach(action => {
                    const p = document.createElement("div");
                    p.className = "log-entry";
                    const type = action[0];

                    if (type === "play_card" || type === "discard_card") {
                        const [_, playerName, color, rank] = action;
                        const actionVerb = type === "play_card" ? "played" : "discarded";
                        p.innerHTML = `${playerName} ${actionVerb} `;
                        
                        const cardBadge = document.createElement("span");
                        cardBadge.className = `log-card-badge badge-${color}`;
                        cardBadge.textContent = rank;
                        p.appendChild(cardBadge);

                    } else if (type === "give_hint") {
                        const [_, giverName, targetName, hintVal] = action;
                        p.innerHTML = `${giverName} hinted ${targetName} about `;

                        const isColor = ["Red", "Yellow", "Green", "Blue", "White"].includes(hintVal);
                        if (isColor) {
                            const colorSquare = document.createElement("span");
                            colorSquare.className = `log-color-square badge-${hintVal}`;
                            p.appendChild(colorSquare);
                        } else {
                            const hintBadge = document.createElement("span");
                            hintBadge.className = `log-card-badge badge-gray`;
                            hintBadge.textContent = hintVal;
                            p.appendChild(hintBadge);
                        }
                    } else {
                        p.textContent = action.join(" ");
                    }
                    logsContainer.appendChild(p);
                });
                logsContainer.scrollTop = logsContainer.scrollHeight;
            }

            const isGameOver = state.game_over;
            const playerNames = state.player_names || [];
            const currentTurnName = playerNames[state.player_turn];
            const isMyTurn = (currentTurnName === myId) && !isGameOver;

            // Render Hands & Board
            const area = document.getElementById('players-area');
            area.innerHTML = '';

            if (isGameOver) {
                const banner = document.createElement('div');
                banner.className = 'mb3 pa3 br2 bg-red white tc fw-bold shadow-1 f4';
                banner.innerText = `Game Over! Final Score: ${state.score} / ${state.max_score}`;
                area.appendChild(banner);
            }

            (state.hands || []).forEach((hand, pIdx) => {
                const playerName = playerNames[pIdx] || `Player ${pIdx}`;
                const isTurn = (playerName === currentTurnName) && !isGameOver;
                const isMe = (playerName === myId);

                const pDiv = document.createElement('div');
                pDiv.className = `mb3 pa3 br2 bg-black-30 ba ${isTurn ? 'b--yellow' : 'b--transparent'}`;
                
                let headerHTML = `<div class="flex justify-between items-center mb2">
                    <div class="flex items-center">`;
                if (isTurn) {
                    headerHTML += `<span class="yellow mr2 fw-bold">➤</span>`;
                }
                headerHTML += `<span class="f5 fw6">${isMe ? 'You (' + playerName + ')' : playerName}</span>`;
                if (isTurn) {
                    headerHTML += `<span class="ml2 f7 bg-yellow dark-gray px1 br1 fw6">Turn</span>`;
                }
                headerHTML += `</div></div>`;
                pDiv.innerHTML = headerHTML;

                const row = document.createElement('div');
                row.className = 'flex flex-row flex-wrap';

                hand.forEach((card, cIdx) => {
                    const cardCol = document.createElement('div');
                    cardCol.className = 'card-column';

                    const cDiv = document.createElement('div');
                    
                    let displayColor = 'gray';
                    let displayRank = '';

                    if (isMe) {
                        const possibleColors = colorNames.filter(c => !(card.eliminated_colors || []).includes(c));
                        displayColor = possibleColors.length === 1 ? possibleColors[0] : 'gray';

                        const possibleRanks = [1, 2, 3, 4, 5].filter(r => !(card.eliminated_ranks || []).includes(r));
                        displayRank = possibleRanks.length === 1 ? possibleRanks[0] : '';
                    } else {
                        displayColor = card.color || 'gray';
                        displayRank = card.rank || '';
                    }

                    cDiv.className = `card-box card-${displayColor.toLowerCase()} shadow-1`;
                    cDiv.innerHTML = `<span class="f3 mb4">${displayRank}</span>`;
                    
                    cDiv.appendChild(createHintMatrix(card, isMe));
                    cardCol.appendChild(cDiv);

                    if (isMyTurn && isMe) {
                        const playBtn = document.createElement('button');
                        playBtn.onclick = () => action('play_card', {card_ind: cIdx});
                        playBtn.className = 'button-reset bg-green white bn pv1 mt2 f7 fw6 pointer action-btn w-100 br1';
                        playBtn.innerText = 'Play';
                        cardCol.appendChild(playBtn);

                        const discardBtn = document.createElement('button');
                        discardBtn.onclick = () => action('discard_card', {card_ind: cIdx});
                        discardBtn.className = 'button-reset bg-red white bn pv1 mt1 f7 fw6 pointer action-btn w-100 br1';
                        discardBtn.innerText = 'Discard';
                        cardCol.appendChild(discardBtn);
                    }

                    row.appendChild(cardCol);
                });
                pDiv.appendChild(row);

                if (isMyTurn && !isMe) {
                    const controls = document.createElement('div');
                    controls.className = 'mt3 pt2 bt b--black-20 flex flex-wrap items-center';
                    
                    const label = document.createElement('span');
                    label.className = 'f6 mr3 o-80';
                    label.innerText = 'Hint:';
                    controls.appendChild(label);
                    
                    colorNames.forEach(c => {
                        const btn = document.createElement('button');
                        btn.onclick = () => action('give_hint', {player_ind: pIdx, hint: {color: c}});
                        
                        let style = "padding: 0.25rem 0.5rem; margin-right: 0.25rem; margin-bottom: 0.25rem; border-radius: 0.2rem; border: 1px solid rgba(0,0,0,0.2); font-weight: bold; cursor: pointer;";
                        if (c === 'Red') style += " background-color: #e74c3c; color: white;";
                        else if (c === 'Blue') style += " background-color: #3498db; color: white;";
                        else if (c === 'Green') style += " background-color: #27ae60; color: white;";
                        else if (c === 'Yellow') style += " background-color: #f1c40f; color: #2c3e50;";
                        else if (c === 'White') style += " background-color: #ecf0f1; color: #2c3e50;";

                        btn.style.cssText = style;
                        btn.className = 'button-reset f7 action-btn';
                        btn.innerText = c[0];
                        controls.appendChild(btn);
                    });

                    [1, 2, 3, 4, 5].forEach(r => {
                        const btn = document.createElement('button');
                        btn.onclick = () => action('give_hint', {player_ind: pIdx, hint: {rank: r}});
                        btn.style.cssText = "background-color: #7f8c8d; color: white; padding: 0.25rem 0.5rem; margin-right: 0.25rem; margin-bottom: 0.25rem; border-radius: 0.2rem; border: 1px solid rgba(0,0,0,0.2); font-weight: bold; cursor: pointer;";
                        btn.className = 'button-reset f7 action-btn';
                        btn.innerText = r;
                        controls.appendChild(btn);
                    });
                    
                    pDiv.appendChild(controls);
                }

                area.appendChild(pDiv);
            });
        }
    </script>
</body>
</html>
