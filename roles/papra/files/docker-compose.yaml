services:
  papra:
    container_name: papra
    image: ghcr.io/papra-hq/papra:latest-root
    restart: unless-stopped

    ports:
      - "1221:1221"

    env_file:
      - papra.env

    volumes:
      - ./app-data:/app/app-data

  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file:
      - cloudflared.env
